<!-- =====================================================================
  灵屿 2.0 · 学生端页面模板
  · 改文案：直接改下面的文字。[[中文|English]] 是中英文成对的文案，竖线左边中文、右边英文
  · {{xxx}} 是程序填入的内容，不要删
  · <template id="p-xxx"> 是一页，id="m-xxx" 是一个弹窗
====================================================================== -->

<!-- 顶部栏：未登录 -->
<template id="hd-out">
<header class="hd">
  <div class="logo"><img src="{{M}}" alt=""><div><b>[[灵 屿|CORISLE]]</b><small>[[AI 心理健康小助手|Your wellbeing companion]]</small></div></div>
  <div class="sp"></div>
  {{lang}}
</header>
</template>

<!-- 顶部栏：已登录。左侧是「去做事」的 6 个 tab；右侧是消息、语言、我自己 -->
<template id="hd-in">
<header class="hd">
  <button class="logo only {{navHome}}" data-act="go" data-arg="home"><img src="{{M}}" alt=""><span>[[个人中心|My space]]</span></button>
  <nav class="tnav">
    <button class="{{navSv}}" data-act="svGo" data-arg="todo">{{iList}}<span class="t">[[心理问卷|Questionnaires]]</span></button>
    <button class="{{navAi}}" data-act="aiGo">{{iChat}}<span class="t">[[AI 访谈|Talk with Xiaoyu]]</span></button>
    <button class="{{navBook}}" data-act="go" data-arg="book">{{iCal}}<span class="t">[[预约咨询|Counselling]]</span> {{bookBadge}}</button>
    <button class="{{navGarden}}" data-act="go" data-arg="garden">{{iLeaf}}<span class="t">[[心理园区|Wellbeing hub]]</span></button>
    <button class="{{navHelp}}" data-act="go" data-arg="help">{{iHelp}}<span class="t">[[帮助中心|Help]]</span></button>
  </nav>
  <div class="sp"></div>
  <div class="bell-w"><button class="bell {{navMsgs}}" data-act="inbox" aria-label="[[消息中心|Notifications]]">{{iBell}}{{unread}}</button>{{inbox}}</div>
  <div class="lang-dock">{{lang}}</div>
  <div class="me-w"><button class="me" data-act="menu" aria-haspopup="menu" aria-expanded="{{menuOpen}}"><span class="sch">N</span><span>{{hello}}</span>{{iDown}}</button>{{menu}}</div>
</header>
</template>

<!-- 个人菜单：和「我」有关的记录与资料 -->
<template id="menu">
<div class="menu">
  <button data-act="go" data-arg="myq">{{iList}}[[我的问卷|My questionnaires]]</button>
  <button data-act="go" data-arg="talks">{{iChat}}[[我的访谈记录|My conversations]]</button>
  <button data-act="go" data-arg="mybook">{{iCal}}[[我的预约|My appointments]]</button>
  <button data-act="go" data-arg="report">{{iCard}}[[我的报告|My reports]]</button>
  <button data-act="go" data-arg="profile">{{iUser}}[[个人信息|My profile]]</button>
  <hr>
  <button data-act="logout">{{iOut}}[[退出|Sign out]]</button>
</div>
</template>

<!-- 消息中心：别人发给我的提醒和动态 -->
<template id="inbox">
<div class="menu inbox">
  <div class="ibh"><b>[[消息中心|Notifications]]</b><button data-act="readAll">[[全部已读|Mark all as read]]</button></div>
  {{items}}
</div>
</template>

<!-- 01 启动页：学校的门面。主人＝NTU UCC；向导＝小屿；提供方＝灵屿（底部落款）。无导航 -->
<template id="p-launch">
<div class="launch fade">
  <div class="ln-art"><img src="{{BG}}" alt="">
    <div class="ln-bub">[[我会陪你看见每一个真实的自己|I’ll be here as you discover the real you]]</div>
    <div class="ln-cap"><b>[[小屿|Xiaoyu]]</b>[[灵屿系统访谈智能体|CORISLE’s AI interview companion]]</div>
  </div>
  <div class="ln-top">
    <div class="ln-host"><span class="crest">NTU</span><b>[[南洋理工大学|Nanyang Technological University]]</b><i></i><span>[[大学心理咨询中心 UCC|University Counselling Centre]]</span></div>
    <span class="sp"></span>{{lang}}
  </div>
  <div class="ln-main">
    <h1>[[认识自己，<br>是一切成长的开始|Getting to know yourself<br>is where all growth begins]]</h1>
    <p class="ln-sub">[[心理普测 · AI 访谈 · 咨询预约 · 心理园区|Wellbeing check · Talk with Xiaoyu · Counselling · Wellbeing hub]]</p>
    <button class="btn pri lg" data-act="start">[[开始体验|Get started]]</button>
  </div>
  <div class="ln-foot"><span>[[由|Powered by]]</span><img src="{{M}}" alt=""><b>[[灵屿|CORISLE]]</b><span>[[提供技术支持|]]</span><i></i><span>[[一站式群体心理健康智能筛查与服务协同系统 · 以 AI 补全情境线索，将群体评估、专业判断与后续支持连成一条完整链路。|One platform for campus mental health screening and support · AI fills in the context, linking screening, professional judgement and follow-up support.]]</span></div>
</div>
</template>

<!-- 协议正文：知情同意书（启动流程和帮助中心共用） -->
<template id="doc-consent">
    <b>[[欢迎你参与南洋理工大学心理健康普测|Welcome to the NTU wellbeing check]]</b>
    <p>[[本次普测包含标准量表与 AI 访谈，用于了解你的心理状态、情绪体验和生活压力，并为你生成非诊断性的个人报告。开始前，请确认以下内容：|This check includes short standard questionnaires and a conversation with an AI, to understand how you’ve been feeling and what’s been weighing on you. You’ll receive a personal, non-diagnostic summary. Before you start, please confirm the following:]]</p>
    <ol>
      <li>[[<b>非医疗诊断声明</b> — 结果仅用于心理健康自我了解和学校心理服务安排，不构成医学诊断或治疗建议。|<b>Not a diagnosis</b> — Results are for self-understanding and for arranging support at NTU. They are not a medical diagnosis or treatment advice.]]</li>
      <li>[[<b>自愿参与原则</b> — 你可以随时暂停或退出，可以跳过任何问题，退出不会对你造成任何不利影响。|<b>Voluntary</b> — You can pause or stop at any time and skip any question. Stopping will not affect you in any way.]]</li>
      <li>[[<b>可能涉及的内容</b> — 可能涉及睡眠、情绪、压力、人际关系、自我价值感等话题。如感到不适，可以立即停止。|<b>What we’ll ask about</b> — Sleep, mood, stress, relationships and self-worth. If anything feels uncomfortable, you can stop right away.]]</li>
      <li>[[<b>学校心理中心查看</b> — 你的量表作答和访谈内容会提供给大学心理咨询中心（UCC）的专业老师，用于复核和安排后续支持；不同岗位的老师只能看到职责范围内的信息。|<b>Who sees your answers</b> — Your answers and conversation are shared with professional staff at the University Counselling Centre (UCC) to review and arrange support. Each staff member only sees what their role requires.]]</li>
      <li>[[<b>保密例外</b> — 如出现可能危及你或他人生命安全的情况，学校心理中心会突破保密，联系你本人、你的紧急联系人或相关人员。|<b>Limits of confidentiality</b> — If there is a risk to your life or someone else’s, UCC may contact you, your emergency contact or others who can help.]]</li>
      <li>[[<b>预约与转介</b> — 预约咨询时，你的问卷和访谈信息会分享给接待你的咨询师；必要时，咨询师可能建议你转介至医疗机构。|<b>Appointments and referral</b> — If you book a session, your counsellor will see your answers. Where needed, they may suggest a referral to medical care.]]</li>
      <li>[[<b>通知方式</b> — 学校可能通过站内消息和短信向你发送普测提醒、预约结果等通知。|<b>Notifications</b> — NTU may send reminders and appointment updates in-app and by SMS.]]</li>
      <li>[[<b>隐私与数据处理</b> — 数据仅用于学校心理服务；统计分析使用匿名数据，不会向任何第三方披露可识别的个人信息。|<b>Privacy</b> — Your data is used only for student support. Statistics use anonymised data, and identifiable information is never shared with third parties.]]</li>
    </ol>
</template>

<template id="doc-privacy">
<b>[[灵屿隐私政策|CORISLE Privacy Policy]]</b>
<p>[[本政策说明灵屿在南洋理工大学心理健康服务中如何收集、使用和保护你的信息。|This policy explains how CORISLE collects, uses and protects your information as part of NTU’s student wellbeing services.]]</p>
<ol>
  <li>[[<b>我们收集的信息</b> — 学号、姓名、校区、学院、手机号、紧急联系人；问卷作答、访谈内容；预约记录。「自我了解」的结果只保存在你的账号里。|<b>What we collect</b> — Matric number, name, campus, college, mobile number and emergency contacts; questionnaire answers and conversations; appointment records. Self-test results stay in your account only.]]</li>
  <li>[[<b>谁能看到</b> — 只有大学心理咨询中心（UCC）中经过授权的工作人员，按岗位查看职责范围内的信息。学生助理只能看到经过脱敏的编号，看不到你的回答。|<b>Who can see it</b> — Only authorised UCC staff, each seeing what their role requires. Student assistants see masked IDs only, never your answers.]]</li>
  <li>[[<b>不会做的事</b> — 不会把可识别你的信息提供给任何第三方；不会用于成绩评定、奖惩或与心理服务无关的用途。|<b>What we never do</b> — Share identifiable information with third parties, or use it for grading, discipline or anything unrelated to student support.]]</li>
  <li>[[<b>保存与删除</b> — 数据保存在新加坡境内的服务器上，在校期间保留；毕业后按学校规定的期限匿名化或删除。|<b>Storage</b> — Data is stored on servers in Singapore while you’re a student, then anonymised or deleted according to NTU’s retention schedule.]]</li>
  <li>[[<b>你的权利</b> — 你可以联系 UCC 查询、更正你的个人信息，或撤回同意。撤回不影响已经提供的服务。|<b>Your rights</b> — Contact UCC to access or correct your information, or to withdraw consent. Withdrawing doesn’t affect support already given.]]</li>
</ol>
</template>

<template id="doc-terms">
<b>[[灵屿用户服务协议|CORISLE Terms of Use]]</b>
<p>[[使用灵屿前，请了解以下约定。|Please read these terms before using CORISLE.]]</p>
<ol>
  <li>[[<b>服务内容</b> — 灵屿提供心理健康普测、AI 访谈、咨询预约和心理园区内容，由大学心理咨询中心（UCC）提供专业支持。|<b>The service</b> — CORISLE offers wellbeing checks, AI conversations, counselling bookings and wellbeing content, with professional support from UCC.]]</li>
  <li>[[<b>关于小屿</b> — 小屿是 AI 访谈助手，不是心理咨询师，它的回应不构成诊断或治疗建议。|<b>About Xiaoyu</b> — Xiaoyu is an AI companion, not a counsellor. Its replies are not a diagnosis or treatment advice.]]</li>
  <li>[[<b>账号</b> — 账号与你的学号和手机号绑定，仅限本人使用。手机号如需更换，请联系 UCC。|<b>Your account</b> — Linked to your matric number and mobile, for your use only. Contact UCC to change your mobile number.]]</li>
  <li>[[<b>预约规则</b> — 至少提前 24 小时预约；每 14 天可改期 1 次、取消 1 次，老师调整时间不计入。|<b>Booking rules</b> — Book at least 24 hours ahead. You can reschedule once and cancel once every 14 days; changes made by your counsellor don’t count.]]</li>
  <li>[[<b>紧急情况</b> — 灵屿不是紧急服务。如果你或他人有生命危险，请立即拨打 995 或 SOS 1767。|<b>Emergencies</b> — CORISLE is not an emergency service. If you or someone else is in danger, call 995 or SOS 1767 right away.]]</li>
</ol>
</template>

<!-- 02 知情同意（1.0 + 2.0 补充条款） -->
<template id="p-consent">
<div class="center fade"><div class="ob">
  {{steps}}
  <h2>[[知情同意书|Informed consent]]</h2>
  <p class="sub">[[这是一段属于你的探索旅程，没有对错之分，可以随时暂停。开始前，请完整阅读以下内容。|A journey that’s all about you — no right or wrong answers, and you can pause anytime. Please read the full statement first.]]</p>
  <div class="consent" id="consentBox" data-keep>
    {{doc}}
    <p style="color:var(--mute)">[[知情同意书 v2.0 · 你的同意时间与版本将被记录|Consent statement v2.0. The time and version of your consent will be recorded.]]</p>
  </div>
  <div class="ck {{ckCls}}" data-act="agree" role="checkbox" aria-checked="{{ckOn}}" tabindex="0"><i>✓</i>[[我已阅读并同意上述知情同意书、|I have read and agree to the consent statement above, the ]]<button class="lnk" data-act="doc" data-arg="privacy">[[《隐私政策》|Privacy policy]]</button>[[和|and the ]]<button class="lnk" data-act="doc" data-arg="terms">[[《用户服务协议》|Terms of use]]</button></div>
  {{readHint}}
  <div class="obnav"><button class="btn sec" data-act="back1" data-arg="launch">{{iLeft}}[[返回|Back]]</button><button class="btn pri" {{nextDis}} data-act="consentNext">[[我已阅读并同意，下一步|Agree and continue]]</button></div>
  <div class="zaps"><span class="zap" data-act="zConsent">⚡ [[演示 · 读完并勾选|Demo: read and tick]]</span></div>
  {{hot}}
</div></div>
</template>

<!-- 03 手机验证（1.0） -->
<template id="p-phone">
<div class="center fade"><div class="ob">
  {{steps}}
  <h2>[[验证你的手机号|Verify your mobile number]]</h2>
  <p class="sub">[[用于保存进度和接收通知，不会用于与普测无关的用途|We use it to save your progress and send updates — nothing else]]</p>
  <div class="fld"><div class="lab">[[手机号|Mobile number]]<em>*</em></div>
    <div class="pre">{{ccSel}}<input class="inp {{phErr}}" data-bind="phone" value="{{phone}}" placeholder="{{phPh}}" maxlength="{{phMax}}" inputmode="numeric"></div>{{phMsg}}</div>
  <div class="fld"><div class="lab">[[验证码|Verification code]]<em>*</em></div>
    <div class="inline"><input class="inp {{cdErr}}" data-bind="code" value="{{code}}" placeholder="[[6 位验证码|6-digit code]]" maxlength="6" inputmode="numeric"><button class="btn sec" style="width:140px;height:44px" id="sendBtn" data-act="sendCode" {{sendDis}}>{{sendLbl}}</button></div>{{cdMsg}}</div>
  <div class="obnav"><button class="btn sec" data-act="back1" data-arg="{{phoneBack}}">{{iLeft}}[[上一步|Back]]</button><button class="btn pri" data-act="phoneNext">[[下一步|Continue]]</button></div>
  <div class="hint">[[若你此前有未完成的普测，验证后将自动识别进度|If you have an unfinished check, we’ll find it after you verify]]</div>
  <div class="zaps"><span class="zap" data-act="zPhone">⚡ [[演示 · 填入手机号和验证码|Demo: fill number and code]]</span></div>
</div></div>
</template>

<!-- 04 基本信息（1.0 + 校区学院 / 紧急联系人 / 名单比对） -->
<template id="p-info">
<div class="center fade"><div class="ob">
  {{steps}}
  <h2>[[填写基本信息|Tell us about you]]</h2>
  <p class="sub">[[这些信息会与学校名单核对，并用于生成你的个人报告|We’ll check these against NTU records and use them for your summary]]</p>
  {{rosterErr}}
  <div class="row2">
    <div class="fld"><div class="lab">[[姓名|Full name]]<em>*</em></div><input class="inp" data-bind="f.name" value="{{name}}" placeholder="[[请输入你的真实姓名|As in NTU records]]"></div>
    <div class="fld"><div class="lab">[[年龄|Age]]<em>*</em></div><input class="inp" data-bind="f.age" value="{{age}}" placeholder="[[如 20|e.g. 20]]" inputmode="numeric"></div>
  </div>
  <div class="fld"><div class="lab">[[性别|Gender]]<em>*</em></div><div class="seg">{{gender}}</div></div>
  <div class="row2">
    <div class="fld dd"><div class="lab">[[学校|University]]<em>*</em></div>
      <button class="inp selbtn" style="color:{{schoolColor}}" data-act="schoolDD">{{schoolLbl}}{{iDown}}</button>{{schoolList}}</div>
    <div class="fld"><div class="lab">[[学号|Matric no.]]<em>*</em></div><input class="inp" data-bind="f.sid" value="{{sid}}" placeholder="[[请输入学号|e.g. U2620318A]]"></div>
  </div>
  <div class="row2">
    <div class="fld"><div class="lab">[[校区|Campus]]<em>*</em></div><select class="inp" data-bind="f.campus" data-rerender>{{campusOpts}}</select></div>
    <div class="fld"><div class="lab">[[学院|College]]<em>*</em></div><select class="inp" data-bind="f.college" data-rerender>{{collegeOpts}}</select></div>
  </div>
  <div class="lab">[[紧急联系人|Emergency contact]]<em>*</em></div>
  <div class="row3 fld">
    <input class="inp" data-bind="f.ecName" value="{{ecName}}" placeholder="[[姓名|Name]]">
    <select class="inp" data-bind="f.ecRel" data-rerender>{{relOpts}}</select>
    <div class="pre">{{ecCcSel}}<input class="inp" data-bind="f.ecTel" value="{{ecTel}}" placeholder="[[手机号|Mobile]]" maxlength="{{ecMax}}" inputmode="numeric"></div>
  </div>
  <div class="note">[[另一位紧急联系人由学校从你的入学资料中导入|A second emergency contact is imported from your enrolment records]]</div>
  {{infoErr}}
  <div class="obnav"><button class="btn sec" data-act="back1" data-arg="phone">{{iLeft}}[[上一步：改手机号|Back: change number]]</button><button class="btn pri" data-act="infoNext">[[确认无误，进入灵屿|Confirm and continue]]</button></div>
  <div class="zaps"><span class="zap" data-act="zInfo">⚡ [[演示 · 填入示例信息|Demo: fill sample]]</span><span class="zap" data-act="zInfoBad">⚡ [[演示 · 名单外学号|Demo: not on records]]</span></div>
</div></div>
</template>

<template id="roster-err">
<div class="alert">{{iInfo}}<div><b>[[没有在学校名单中找到你的信息|We couldn’t find you in NTU records]]</b><br>[[请确认学号和手机号与学校登记的一致；手机号填错的话，可以点「上一步」修改。如果信息无误，请联系大学心理咨询中心（UCC）补录：|Check that your matric number and mobile match NTU’s records — tap Back to fix your number. If they’re correct, contact UCC to be added:]]<br>{{ucc}}</div></div>
</template>

<!-- 05 个人中心 -->
<template id="p-home">
<div class="page fade"><div class="wrap">
  <div class="hero"><img src="{{M}}" alt=""><div><h2>{{greet}}</h2><div class="say"><b>[[小屿提醒：|Xiaoyu says:]]</b>“{{say}}”</div></div></div>
  {{newMessages}}
  {{mv}}
  <div class="sect">[[我的待办|To do]]<span style="font-weight:400;font-size:13px;color:var(--mute2)">{{todoN}}</span></div>
  <div class="panel">{{todos}}</div>
  <div class="sect">[[最近足迹|Recent activity]]</div>
  <div class="panel foot">{{foot}}</div>
  <div class="sect">[[为你推荐|For you]]<button data-act="go" data-arg="garden">[[去心理园区|Open the hub]]</button></div>
  <div class="cards">{{recs}}</div>
</div></div>
</template>

<!-- 个人中心主任务卡：未完成 -->
<template id="mission-todo">
<div class="mission">
  <div><h3>{{tName}} {{reqTag}}</h3><div class="meta"><span>{{iUser}}[[来自|From]] {{from}}</span><span>{{iClock}}[[剩余有效期|Due in]] {{left}}</span><span>{{iSand}}{{dur}}</span></div></div>
  <button class="btn pri" data-act="taskGo">{{taskBtn}}</button>

</div>

<!-- 个人中心主任务卡：已完成 -->
<template id="mission-done">
<div class="mission ok">
  <div><h3>{{tName}} <span class="pill g">[[已完成|Completed]]</span></h3><div class="meta"><span>{{iCheck}}{{doneAt}} [[完成|completed]]</span><span>{{iCard}}[[小屿已为你整理好卡片|Xiaoyu has written your card]]</span></div></div>
  <button class="btn soft" data-act="card" data-arg="cur">[[查看我的卡片|View my card]]</button>
</div>
</template>

<!-- 06 任务说明（沿用 1.0 欢迎卡） -->
<template id="p-intro">
<div class="center fade"><div class="ob" style="text-align:center">
  {{top}}
  <h2 style="margin-top:16px">{{tName}}</h2>
  <p class="sub">[[来自|From]] {{from}}</p>
  {{reuse}}
  <div class="box2">
    <div><span>[[包含内容|What’s included]]</span><b>{{incl}}</b></div>
    <div><span>[[预计用时|Time]]</span><b>{{dur}}</b></div>
    <div><span>[[有效期至|Complete by]]</span><b>{{until}}</b></div>
  </div>
  <p style="color:var(--ink2);text-align:left;font-size:14px;line-height:1.9">{{text}}</p>
  <button class="btn pri blk" data-act="introGo">{{goLbl}}</button>
  <div class="hint">[[进度会自动保存|Your progress saves automatically]]</div>
  {{decl}}
</div></div>
</template>

<!-- 07 标准化问卷（独立页面，在访谈之前完成） -->
<template id="p-survey">
<div class="stage fade" style="flex-direction:column">
  <div class="page" id="survey" data-keep style="padding-bottom:24px"><div class="wrap" style="width:min(780px,100%)">
    <div class="ph"><p style="font-size:13px">{{task}}</p><h2>{{title}}</h2><p>{{guide}}</p></div>
    <div class="qhead" style="margin:0 0 8px"><small>[[这是国际通用的标准化问卷，题目和选项保持原样|A standardised questionnaire used worldwide. Questions and options are unchanged.]]</small><small>{{pos}}</small></div>
    <div class="qbar"><i style="width:{{pct}}%"></i></div>

  <div class="acts"><button class="btn soft sm" data-act="cardChat">[[查看对话记录|View conversation]]</button><button class="btn soft sm" data-act="modal" data-arg="share">{{iShare}}[[生成分享图|Create share image]]</button><button class="btn pri sm" data-act="toast" data-arg="saved">{{iDl}}[[下载卡片|Download]]</button></div>
</div>
</template>

<template id="m-share">
<div class="mo"><button class="x" data-act="close" aria-label="close">{{iX}}</button>
  <h3 style="margin-top:0">[[分享我的卡片|Share my card]]</h3>
  <div class="share"><img class="mascot s" src="{{M}}" alt="" style="margin:0 auto"><b>[[来自灵屿|From CORISLE]]</b><p>{{line}}</p><small style="color:var(--mute2)">[[灵屿 · 南洋理工大学心理健康普测|CORISLE · NTU wellbeing check]]</small></div>
  <p style="font-size:13px">[[分享图对每位同学都一样，不包含你的卡片内容、作答和对话。链接 7 天内有效。|The share image is the same for everyone and never includes your card, answers or conversation. Links expire after 7 days.]]</p>
  <div class="acts"><button class="btn sec" data-act="toast" data-arg="linkCopied">[[复制链接|Copy link]]</button><button class="btn pri" data-act="toast" data-arg="imgSaved">[[保存分享图|Save image]]</button></div>
</div>
</template>

<template id="m-trans">
<div class="mo l"><button class="x" data-act="close" aria-label="close">{{iX}}</button><h3>[[对话记录|Conversation]]</h3>{{lines}}</div>
</template>

<template id="m-counsellor">
<div class="mo l"><button class="x" data-act="close" aria-label="close">{{iX}}</button>
  <div style="display:flex;gap:16px;align-items:center;margin-bottom:14px">{{av}}<div><h3 style="margin:0">{{name}}</h3><small style="color:var(--mute2)">{{role}}，{{campus}}</small></div></div>
  <p style="color:var(--ink2)">{{bio}}</p>
  <div class="tg" style="margin-bottom:18px">{{tags}}</div>
  <div class="lab" style="font-size:13px;color:var(--ink)">[[近期可预约时间|Upcoming times]]</div>
  {{slots}}
</div>
</template>

<template id="m-submit">
<div class="mo l"><button class="x" data-act="close" aria-label="close">{{iX}}</button>
  <h3>{{mTitle}}</h3>
  <div class="box2"><div><span>[[咨询师|Counsellor]]</span><b>{{name}}</b></div><div><span>[[时间|Time]]</span><b>{{when}}</b></div><div><span>[[类型|Type]]</span><b>{{kind}}</b></div></div>
  <div class="fld"><div class="lab">[[咨询方式|How would you like to meet?]]</div><div class="seg">{{modes}}</div></div>
  <div class="fld"><div class="lab">[[想聊的主题（可多选）|What would you like to talk about? (optional)]]</div><div class="chips">{{topics}}</div></div>
  <div class="fld"><div class="lab">[[想先告诉老师的话（选填）|Anything you’d like the counsellor to know first? (optional)]]</div><textarea class="inp" data-bind="bkNote" id="bkNote" placeholder="[[比如最近困扰你的事|For example, what’s been on your mind]]">{{note}}</textarea></div>
  <div class="tip" style="background:var(--bub);border-radius:10px;padding:10px 14px;margin:0">{{iInfo}}<span>[[提交后，你在学校任务里的问卷和访谈会分享给这位咨询师；「自我了解」的结果不会分享。提交的是预约申请，老师确认后才算约好，会通知你。|Your counsellor will see your NTU questionnaires and conversation — never your self-test results. It’s a request until your counsellor confirms it; we’ll let you know.]]</span></div>
  <div class="acts"><button class="btn sec" data-act="close">[[返回|Back]]</button><button class="btn pri" data-act="bookSubmit">{{mBtn}}</button></div>
</div>
</template>

<template id="m-booked">
<div class="mo"><div class="okmark">{{iCheck}}</div>
  <h3>{{title}}</h3>
  <div class="box2"><div><span>[[咨询师|Counsellor]]</span><b>{{name}}</b></div><div><span>[[时间|Time]]</span><b>{{when}}</b></div></div>
  <p>{{text}}</p>
  <div class="acts"><button class="btn sec" data-act="go" data-arg="home">[[回到个人中心|Back to My space]]</button><button class="btn pri" data-act="go" data-arg="mybook">[[查看我的预约|View my appointments]]</button></div>
</div>
</template>

<template id="m-doneS">
<div class="mo"><div class="okmark">{{iCheck}}</div>
  <h3>[[已提交|Submitted]]</h3>
  <p>[[谢谢你，「{{tName}}」已经提交。|Thank you — “{{tName}}” has been submitted.]]{{reuseLine}}</p>
  <div class="acts"><button class="btn pri" data-act="doneSOk">[[回到个人中心|Back to My space]]</button></div>
</div>
</template>

<!-- 进入个人中心时的任务提醒（有新任务或未完成任务才弹） -->
<template id="m-remind">
<div class="mo"><img class="mascot" src="{{M}}" alt="">
  <h3>{{title}}</h3>
  <p>{{lead}}</p>
  <div class="box2 rlist">{{rows}}</div>
  <div class="acts"><button class="btn sec" data-act="close">[[稍后再说|Later]]</button></div>
</div>
</template>

<template id="m-ec">
<div class="mo l"><button class="x" data-act="close" aria-label="close">{{iX}}</button>
  <h3>[[修改紧急联系人|Edit emergency contact]]</h3>
  <div class="row3 fld"><input class="inp" data-bind="ec.name" value="{{name}}" placeholder="[[姓名|Name]]"><select class="inp" data-bind="ec.rel">{{rels}}</select><div class="pre">{{ccSel}}<input class="inp" data-bind="ec.tel" value="{{tel}}" maxlength="{{max}}" inputmode="numeric"></div></div>
  {{err}}
  <div class="acts"><button class="btn sec" data-act="close">[[取消|Cancel]]</button><button class="btn pri" data-act="ecSave">[[保存|Save]]</button></div>
</div>
</template>

<!-- 老师调整了预约时间（后台主动改约） -->
<template id="m-doc">
<div class="mo docm"><button class="x" data-act="close" aria-label="close">{{iX}}</button>
  <h3 style="margin-top:0">{{title}}</h3>
  <p class="dmeta">{{meta}}</p>
  <div class="consent doc">{{doc}}</div>
  <div class="acts"><button class="btn pri" data-act="close">[[关闭|Close]]</button></div>
</div>
</template>

<template id="m-info">
<div class="mo"><div class="okmark" style="background:var(--bub);color:var(--gold2)">{{ico}}</div>
  <h3>{{title}}</h3><p>{{body}}</p>
  <div class="acts">{{btns}}</div>
</div>
</template>

<template id="m-appr">
<div class="mo"><div class="okmark">{{iCheck}}</div>
  <h3>{{title}}</h3><p>{{body}}</p>
  <p style="font-size:12.5px;color:var(--mute)">{{iPhone}} [[已同步短信通知|Also sent to you by SMS]]</p>
  <div class="acts"><button class="btn pri" data-act="close">[[知道了|Got it]]</button></div>
</div>
</template>

<template id="m-moved">
<div class="mo"><div class="okmark" style="background:var(--pri-t);color:var(--gold2)">{{iCal}}</div>
  <h3>[[老师调整了你的预约时间|Your counsellor changed the time]]</h3>
  <div class="box2"><div><span>[[咨询师|Counsellor]]</span><b>{{name}}</b></div><div><span>[[原时间|Was]]</span><b style="text-decoration:line-through;color:var(--mute2)">{{old}}</b></div><div><span>[[新时间|Now]]</span><b>{{new}}</b></div></div>
  <p>[[新时间可以的话，点「接受」就会生效；不方便的话，可以改期另选时间。|If the new time works, accept it. Otherwise, reschedule to pick another time.]]</p>
  <div class="acts"><button class="btn sec" data-act="movedResch">[[改期|Reschedule]]</button><button class="btn pri" data-act="movedOk">[[接受新时间|Accept new time]]</button></div>
</div>
</template>

<!-- 改期确认：原预约作废、时段释放 -->
<template id="m-resch">
<div class="mo"><h3 style="margin-top:0">[[确定要改期吗？|Reschedule this appointment?]]</h3>
  <p>{{body}}</p>
  <div class="acts"><button class="btn sec" data-act="close">[[不改了|Keep it]]</button><button class="btn pri" data-act="reschOk">[[确定改期|Reschedule]]</button></div>
</div>
</template>

<!-- 重新对话 -->
<template id="m-redo">
<div class="mo"><img class="mascot" src="{{M}}" alt="">
  <h3>[[和小屿重新聊一次？|Start a new chat with Xiaoyu?]]</h3>
  <p>[[有效期内可以重新对话。上一轮会保留在访谈记录里，这一轮完成后会生成新的卡片。|You can start again before the due date. The last chat stays in your history, and you’ll get a new card when this one ends.]]</p>
  <div class="acts"><button class="btn sec" data-act="close">[[再想想|Not now]]</button><button class="btn pri" data-act="redoOk">[[开始新一轮|Start again]]</button></div>
</div>
</template>

<template id="m-switch">
<div class="mo"><img class="mascot" src="{{M}}" alt="">
  <h3>[[先做哪一项？|Which one first?]]</h3>
  <p>[[你还有一项没做完：「{{cur}}」（{{prog}}）。<br>两边的进度都会保存，随时可以回来。|You still have “{{cur}}” in progress ({{prog}}).<br>Both will be saved, so you can come back anytime.]]</p>
  <div class="acts"><button class="btn sec" data-act="switchKeep">[[继续「{{cur}}」|Continue “{{cur}}”]]</button><button class="btn pri" data-act="switchGo">[[先做这一项|Do this one first]]</button></div>
</div>
</template>

<template id="m-cancel">
<div class="mo"><h3 style="margin-top:0">[[取消这次预约？|Cancel this appointment?]]</h3>
  <p>{{body}}</p>
  <div class="acts"><button class="btn sec" data-act="close">[[保留预约|Keep it]]</button><button class="btn pri" data-act="cancelOk">[[取消预约|Cancel appointment]]</button></div>
</div>
</template>

<template id="m-change">
<div class="mo l"><button class="x" data-act="close" aria-label="close">{{iX}}</button>
  <h3>[[申请更换咨询师|Request a different counsellor]]</h3>
  <p style="font-size:13.5px">[[更换需要你现在的咨询师 {{cur}} 同意。通过后，你需要像第一次一样，先和新的老师进行一次预咨询，再继续后面的咨询。审批期间不影响你已有的预约。|{{cur}}, your current counsellor, needs to approve. Once approved, you’ll start again with an intake chat with a new counsellor. Existing appointments aren’t affected while you wait.]]</p>
  <div class="fld"><div class="lab">[[更换原因|Reason]]</div><div class="chips">{{reasons}}</div></div>
  <div class="acts"><button class="btn sec" data-act="close">[[返回|Back]]</button><button class="btn pri" data-act="chgSubmit">[[提交申请|Send request]]</button></div>
</div>
</template>

<template id="m-gd">
<div class="mo gdm"><button class="x" data-act="close" aria-label="close">{{iX}}</button>

  <h3 style="margin-top:6px">{{title}}</h3>
  {{body}}
  <div class="prog">{{prog}}</div><small style="color:var(--mute)">{{stepLbl}}</small>
  <div class="acts">{{btns}}</div>
</div>
</template>

<template id="m-about">

  <h3>[[关于我们|About]]</h3>
  <p>[[灵屿是南洋理工大学大学心理咨询中心（UCC）使用的心理健康普测与服务平台，由扶光心舍提供技术支持。小屿是平台中的 AI 交互角色，负责陪你完成访谈，不替代专业人员的判断。|CORISLE is the wellbeing check and support platform used by NTU’s University Counselling Centre (UCC), built by Cormira. Xiaoyu is the AI companion who guides the conversation — it never replaces a professional’s judgement.]]</p>
  <div class="acts"><button class="btn pri" data-act="close">[[知道了|Got it]]</button></div>
</div>
</template>

<div class="mo"><div class="okmark">{{iCheck}}</div>
